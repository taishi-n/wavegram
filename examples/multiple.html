<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wavegram - Multiple</title>
    <script type="module" src="../src/index.ts"></script>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        gap: 18px;
        max-width: 900px;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Mixture</h2>
        <wavegram-player src="https://raw.githubusercontent.com/pdx-cs-sound/wavs/main/voice.wav"></wavegram-player>
      </section>
      <section>
        <h2>Estimated source 1</h2>
        <wavegram-player src="https://raw.githubusercontent.com/pdx-cs-sound/wavs/main/synth.wav"></wavegram-player>
      </section>
      <section>
        <h2>Estimated source 2</h2>
        <wavegram-player src="https://raw.githubusercontent.com/pdx-cs-sound/wavs/main/gc.wav"></wavegram-player>
      </section>
      <section>
        <h2>Reference source 1</h2>
        <wavegram-player src="https://raw.githubusercontent.com/pdx-cs-sound/wavs/main/voice-note.wav"></wavegram-player>
      </section>
      <section>
        <h2>Reference source 2</h2>
        <wavegram-player src="https://raw.githubusercontent.com/pdx-cs-sound/wavs/main/fifths.wav"></wavegram-player>
      </section>
    </main>
  </body>
</html>
